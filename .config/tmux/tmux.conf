# --- TMP Path---
set-environment -g TMUX_PLUGIN_MANAGER_PATH '/home/franz/.config/tmux/plugins'

# --- TPM Plugins ---
set-option -g @tmux-powerline-config '/home/franz/.config/tmux/tmux-powerline/config.sh'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'armando-rios/tmux'

# --- Modern Kitty & Clipboard ---
set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -g mouse on
set -g allow-passthrough on
set -s set-clipboard on

# --- Prefix ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- pane highligting ---
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour208

# --- Navigation & Resizing (Vim-Style) ---
bind -n M-1 select-pane -t:.0
bind -n M-2 select-pane -t:.1
bind -n M-3 select-pane -t:.2
bind -n M-4 select-pane -t:.3

# --- Copy Mode ---
set-window-option -g mode-keys vi
bind Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# --- tmux-powerline ---
set -g status on
set -g status-interval 2
set -g status-justify "left"
set -g status-left-length 60
set -g status-right-length 90

set -g status-left '#(~/.tmux/plugins/tmux-powerline/powerline.sh left)'
set -g status-right '#(~/.tmux/plugins/tmux-powerline/powerline.sh right)'

set-window-option -g window-status-current-format '#[fg=colour235,bg=colour27] #I #W #[fg=colour27,bg=colour235]'

# --- Hot Reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

run '/home/franz/.config/tmux/plugins/tpm/tpm'
