# --- BASIC SETTINGS & BARE METAL OPTIMIZATIONS ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g status-interval 5
set -g mouse on
set -g utf8 on

# Fix für Vim: Verhindert die nervige Verzögerung nach dem Drücken von ESC
set -s escape-time 0

# Erhöhe das History-Limit für tiefes Scrollen in Logs
set -g history-limit 50000

# --- CLIPBOARD & MOUSE (Vim Mode) ---
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard -i"

# --- STATUS BAR STYLE (Pure Matrix CLI) ---
set -g status-bg colour234
set -g status-fg colour245

set -g status-left-length 50
set -g status-right-length 120

# LINKS: Radikal reduziert – fängt direkt lückenlos mit dem Git-Status an
set -g status-left "#[fg=colour136] Git: #($HOME/.tmux/scripts/git_status.sh) #[fg=colour238]| "

# RECHTS: Spotify-Text, Zeit, Datum
set -g status-right "#[fg=colour238]| #[fg=colour32]%H:%M #[fg=colour238]| #[fg=colour245]%d.%m.%Y "

# WINDOW STATUS: Aktives Fenster mit ">" und "<" markiert
set-window-option -g window-status-current-style fg=colour121,bg=colour236,bold
set-window-option -g window-status-current-format "#[fg=colour90]>#[fg=colour121] #W #[fg=colour90]<"

set-window-option -g window-status-style fg=colour242,bg=colour234
set-window-option -g window-status-format " #W "

# --- LAYOUT ---
set -g status-justify left

# --- KEYMAPPING ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- MODIFIED DIRECT PANE SELECTION ---
# Alt + 1, 2, 3, 4 statt F-Tasten
bind -n M-1 select-pane -t:.0
bind -n M-2 select-pane -t:.1
bind -n M-3 select-pane -t:.2
bind -n M-4 select-pane -t:.3
