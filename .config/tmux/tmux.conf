# --- Basic Settings ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g status-interval 5
set -g mouse on
set -s escape-time 0
set -g history-limit 50000

# --- TPM Custom Config Path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# --- Powerline Custom Config Path
set-environment -g TMUX_POWERLINE_DIR "$HOME/.config/tmux/tmux-powerline"

# --- Plugin Manager ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'armando-rios/tmux'

# --- Copy Mode & Mouse (Vim Bindings) ---
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard -i"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line

# --- Keybindings ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind Escape copy-mode
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Pane navigation
bind -n M-1 select-pane -t:.0
bind -n M-2 select-pane -t:.1
bind -n M-3 select-pane -t:.2
bind -n M-4 select-pane -t:.3

# --- Powerline Settings ---
set -g @tmux_theme "one-dark"

run "$HOME/.config/tmux/plugins/tpm/tpm"
set -g @tmux_powerline_right_status_segments "mail-count %Y-%m-%d %H:%M"

