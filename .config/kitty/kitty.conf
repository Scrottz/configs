# --- Font Settings ---
# We use the JetBrains Mono Nerd Font Mono for perfect alignment
font_family      JetBrainsMonoNerdFontMono-Regular
bold_font        JetBrainsMonoNerdFontMono-Bold
italic_font      JetBrainsMonoNerdFontMono-Italic
bold_italic_font JetBrainsMonoNerdFontMono-BoldItalic
font_size        12.0

# --- Colors (Green on Black) ---
# Classic hacker green (#00FF00) on pure black
foreground       #00FF00
background       #000000

# Selection colors
selection_foreground #000000
selection_background #00FF00

# Cursor
cursor           #00FF00
cursor_shape     block

# Basic ANSI colors (Terminal Green)
color0  #000000
color8  #555555
color1  #FF0000
color9  #FF5555
color2  #00FF00
color10 #55FF55
color3  #FFFF00
color11 #FFFF55
color4  #0000FF
color12 #5555FF
color5  #FF00FF
color13 #FF55FF
color6  #00FFFF
color14 #55FFFF
color7  #AAAAAA
color15 #FFFFFF

# --- Performance & Integration ---
# Ensure Zellij and Kitty work together without shortcut interference
clear_all_shortcuts yes

# Re-enable basics
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

# Essential for Zellij to work with images/hyperlinks
allow_remote_control yes
listen_on unix:/tmp/kitty

# Disable bell to keep it quiet
enable_audio_bell no
