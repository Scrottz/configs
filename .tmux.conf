# --- Basic Settings ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g status-interval 5
set -g mouse on
set -s escape-time 0
set -g history-limit 50000

# --- Copy Mode & Mouse (Vim Bindings) ---
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard -i"

# --- Keybindings ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind -n M-1 select-pane -t:.0
bind -n M-2 select-pane -t:.1
bind -n M-3 select-pane -t:.2
bind -n M-4 select-pane -t:.3

# --- Status Bar ---
set -g status-bg colour234
set -g status-fg colour245
set -g status-justify centre

# Status bar format with Git, Mail-Count and Time
set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[fg=colour136] Git: #($HOME/.tmux/scripts/git_status.sh)"
set -g status-right "#[fg=colour245]%d.%m.%Y | #[fg=colour32]%H:%M"

# Integrate Mail-Count in the center
set -g status-format[0] "#[align=left]#[fg=colour136] Git: #($HOME/.tmux/scripts/git_status.sh) #[align=centre]#[fg=colour121]#(~/.config/neomutt/mail-count.sh) #[align=right]#[fg=colour245]%d.%m.%Y | #[fg=colour32]%H:%M"

# Window status
set-window-option -g window-status-current-style fg=colour121,bg=colour236,bold
set-window-option -g window-status-current-format "#[fg=colour90]>#[fg=colour121] #W #[fg=colour90]<"
set-window-option -g window-status-style fg=colour242,bg=colour234
set-window-option -g window-status-format " #W "
