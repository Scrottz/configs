[main]
font=JetBrainsMono Nerd Font Mono:size=11

[colors-dark]
# Classic terminal look: Green on Black
# Foreground is the text color, background is the terminal surface
foreground=00ff00
background=000000

# Regular color palette (standard ANSI colors)
regular0=000000  # Black
regular1=ff0000  # Red
regular2=00ff00  # Green
regular3=ffff00  # Yellow
regular4=0000ff  # Blue
regular5=ff00ff  # Magenta
regular6=00ffff  # Cyan
regular7=ffffff  # White

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[scrollback]
lines=10000
multiplier=3.0

[bell]
urgent=yes
notify=yes
